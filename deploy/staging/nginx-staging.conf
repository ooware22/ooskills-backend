# OOSkills STAGING — nginx sites
# Install: /etc/nginx/sites-available/ooskills-staging  (+ symlink in sites-enabled)
# HTTPS is added afterwards by:  certbot --nginx -d staging.ooskills.com -d api-staging.ooskills.com

# --- Backend API: api-staging.ooskills.com → gunicorn :8001 -----------------
server {
    listen 80;
    server_name api-staging.ooskills.com;

    client_max_body_size 200M;   # course ZIP imports
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# --- Frontend: staging.ooskills.com → Next.js :3001 --------------------------
server {
    listen 80;
    server_name staging.ooskills.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional: keep the public out of staging. Create the file with
    #   htpasswd -c /etc/nginx/.htpasswd-staging <username>
    # then uncomment these two lines.
    # auth_basic "OOSkills staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-staging;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
