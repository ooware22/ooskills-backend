name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_SSLMODE: disable
      SECRET_KEY: ci-test-secret-key-not-used-in-prod
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run test suite
        run: python manage.py test

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Ensure proper permissions
            chown -R ooskills:ooskills /var/www/ooskills/ooskills-backend

            su - ooskills -c '
              set -e
              cd /var/www/ooskills/ooskills-backend
              git fetch origin
              git reset --hard origin/main
              venv/bin/pip install -q -r requirements.txt
              venv/bin/python manage.py migrate --noinput
              venv/bin/python manage.py collectstatic --noinput
            '

            # Restart backend service
            systemctl restart ooskills-backend

            # Wait and verify the service becomes active
            echo "Waiting for ooskills-backend to be ready..."
            for i in {1..15}; do
              if systemctl is-active --quiet ooskills-backend; then
                echo "ooskills-backend is active and running!"
                exit 0
              fi
              sleep 1
            done

            echo "ERROR: ooskills-backend failed to start after 15 seconds."
            systemctl status ooskills-backend -l --no-pager
            journalctl -u ooskills-backend -n 30 --no-pager
            exit 1
